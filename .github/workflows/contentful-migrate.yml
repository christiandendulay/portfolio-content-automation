name: Contentful Migration

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/contentful-migrate.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Run new migrations
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep '^migrations/' | sort | while read file; do
            echo "▶️ Running $file..."
            pnpm exec contentful space migration \
              --space-id $CONTENTFUL_SPACE_ID \
              --management-token $CONTENTFUL_MANAGEMENT_TOKEN \
              --environment-id $CONTENTFUL_ENVIRONMENT \
              --yes \
              "$file" || echo "⏭️  Skipped or failed: $file"
          done
